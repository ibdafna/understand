<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Understand</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'%3E%3Cpath d='M10 3H6v18h4' stroke='%2318191b' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='17' cy='12' r='3.4' fill='%232f5bd1'/%3E%3C/svg%3E">
<script>
/* The theme: the system's, unless the reader picked one (remembered for every page). Set before first paint. */
(function () {
  var pick; try { pick = localStorage.getItem("understand:theme"); } catch (e) {}
  var dark = pick === "dark" || (pick !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
})();
</script>
<style>
:root {
  --bg: #f6f6f4; --panel: #ffffff; --sunk: #f1f1ee; --ink: #18191b; --mid: #4a4d53; --dim: #686c72;
  --line: #deded9; --line2: #eaeae5;
  --add: #1d7a3a; --del: #b3402e; --mod: #8e6a00; --move: #6941c6;
  --care: #c2410c; --care-bg: #fdede4; --note: #2f5bd1; --note-bg: #eaf0fd;
  --warn: #b54708; --warn-bg: #fff4e5;
  --human: #2f5bd1; --agent: #7a3fd1; --human-bg: #e7eefc; --agent-bg: #f1eafc; --add-bg: #e6f4ea;
  --shadow: 0 12px 32px rgba(20, 20, 30, .14), 0 1px 3px rgba(20, 20, 30, .08);
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --seg-on: #ffffff;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0f1012; --panel: #16171a; --sunk: #121315; --ink: #ecedef; --mid: #b4b7bd; --dim: #8a8e96;
  --line: #26282c; --line2: #1e2023;
  --add: #6fd394; --del: #ff8c7a; --mod: #e2c35c; --move: #b69cf5;
  --care: #ff9a62; --care-bg: rgba(255, 154, 98, .12); --note: #8db4ff; --note-bg: rgba(141, 180, 255, .12);
  --warn: #ffb45e; --warn-bg: rgba(255, 180, 94, .1);
  --human: #8db4ff; --agent: #c19bff; --human-bg: rgba(141, 180, 255, .14); --agent-bg: rgba(193, 155, 255, .14); --add-bg: rgba(111, 211, 148, .12);
  --shadow: 0 12px 32px rgba(0, 0, 0, .55), 0 1px 3px rgba(0, 0, 0, .4);
  --seg-on: #34373d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { overflow-x: clip; }
body { background: var(--bg); color: var(--ink); font: 13.5px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
a { color: inherit; }
code, .mono { font-family: var(--mono); }
code.ic { font-size: .92em; background: var(--sunk); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; overflow-wrap: anywhere; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
[hidden] { display: none !important; }
.spacer { flex: 1; }
.num { font: 11.5px var(--mono); white-space: nowrap; }
.plus { color: var(--add); } .minus { color: var(--del); }
kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 17px; height: 17px; padding: 0 4px; border: 1px solid var(--line); border-radius: 4px; font: 500 10.5px var(--mono); color: var(--mid); background: var(--sunk); }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); font-size: 12.5px; font-weight: 500; color: var(--ink); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--dim); }
.btn.small { height: 24px; padding: 0 8px; font-size: 12px; }
.btn.small.icon { width: 26px; padding: 0; justify-content: center; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--panel); }
.btn.primary:hover { opacity: .9; }
.btn:disabled { opacity: .45; cursor: default; }
.btn svg { flex: none; }
.link { border: 0; background: none; padding: 0; color: var(--note); cursor: pointer; font-size: 12.5px; }
.link.quiet { color: var(--dim); }
.link:hover { text-decoration: underline; }
.seg { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 7px; background: var(--sunk); }
.seg button { border: 0; background: transparent; border-radius: 5px; padding: 3px 10px; font-size: 12px; font-weight: 500; color: var(--mid); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
.seg.icons button { width: 26px; height: 22px; padding: 0; }

/* ---------- top bar ---------- */
.top { position: sticky; top: 0; z-index: 30; height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; letter-spacing: -.01em; white-space: nowrap; }
.slash { color: var(--line); font-size: 18px; }
.range { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px; font: 12.5px var(--mono); min-width: 0; flex: 0 1 auto; }
.range span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.range span:first-child { flex: none; max-width: 240px; }
.range .base { color: var(--dim); }
.totals { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--dim); white-space: nowrap; min-width: 0; overflow: hidden; }
.progress { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--mid); white-space: nowrap; }
.bar { width: 90px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--add); transition: width .2s; }
.keys-pop { position: absolute; top: 46px; right: 16px; width: 260px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); display: grid; grid-template-columns: 1fr auto; gap: 7px 12px; font-size: 12.5px; color: var(--mid); align-items: center; }
.keys-pop b { grid-column: 1 / -1; color: var(--ink); font-weight: 600; }
.keys-pop span:nth-of-type(even) { display: flex; gap: 3px; justify-content: flex-end; }

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: 272px minmax(0, 1fr) 288px; }
.side, .rail { position: sticky; top: 52px; height: calc(100vh - 52px); overflow: auto; background: var(--panel); }
.side { border-right: 1px solid var(--line); padding: 12px 10px 0; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
.side #tree { flex: 1; min-height: 0; overflow: auto; margin: 0 -10px; padding: 4px 10px 24px; border-top: 1px solid var(--line2); scroll-padding: 8px 0; }
.rail { border-left: 1px solid var(--line); display: flex; flex-direction: column; }
.side .seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.filter { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--sunk); color: var(--dim); }
.filter input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font-size: 12.5px; outline: none; }
.filter:focus-within { border-color: var(--note); }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.quick button { height: 24px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); font-size: 11.5px; color: var(--mid); cursor: pointer; }
.quick button[aria-pressed="true"] { border-color: var(--note); color: var(--note); background: var(--note-bg); }
.quick button.care[aria-pressed="true"] { border-color: var(--care); color: var(--care); background: var(--care-bg); }
.quick button.gap[aria-pressed="true"] { border-color: var(--warn); color: var(--warn); background: var(--warn-bg); }
.quick button:disabled { opacity: .45; cursor: default; }
.t-group { font-size: 12px; font-weight: 600; color: var(--ink); padding: 12px 8px 4px; display: flex; gap: 8px; }
.t-group .n { font-family: var(--mono); font-weight: 500; }
.t-group.file { text-transform: none; letter-spacing: 0; font: 600 12px var(--mono); color: var(--mid); }
.t-row { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 3px 8px; border-radius: 6px; font: 12.5px var(--mono); color: var(--mid); text-decoration: none; cursor: pointer; }
.t-row:hover { background: var(--sunk); color: var(--ink); }
.t-row.current { background: var(--note-bg); color: var(--ink); }
.t-row.viewed .nm { color: var(--dim); text-decoration: line-through; }
.t-row.dim { opacity: .35; }
.t-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.marks { display: flex; gap: 6px; align-items: center; }
.dot { width: 6px; height: 6px; border-radius: 3px; background: var(--care); flex: none; }
.dot.gap { background: transparent; border: 1.5px dashed var(--warn); width: 8px; height: 8px; border-radius: 50%; }
.cc { font: 600 11px var(--mono); color: var(--note); }
.glyph { font: 700 12.5px var(--mono); text-align: center; }
.glyph.added { color: var(--add); } .glyph.removed { color: var(--del); } .glyph.modified { color: var(--mod); } .glyph.moved { color: var(--move); }
.empty { color: var(--dim); font-size: 12.5px; padding: 8px; margin: 0; }

.d-row { padding: 8px; border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; border: 1px solid transparent; }
.d-row:hover { background: var(--sunk); }
.d-row.active { border-color: var(--note); background: var(--note-bg); }
.d-row.superseded { opacity: .55; }
.d-top { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; }
.d-top .id { font: 11.5px var(--mono); color: var(--dim); }
.d-meta { display: flex; gap: 8px; font-size: 11.5px; color: var(--dim); align-items: center; flex-wrap: wrap; }
.who { font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.who.human { color: var(--human); } .who.agent { color: var(--agent); }

/* ---------- main ---------- */
main { min-width: 0; padding-bottom: 120px; }
.head { padding: 18px 24px 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.head h1 { margin: 0; font-size: 20px; line-height: 1.25; letter-spacing: -.015em; font-weight: 600; }
.head p { margin: 0; color: var(--mid); max-width: 80ch; }
.meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--dim); }
.meta .care { color: var(--care); } .meta .ok { color: var(--add); } .meta .gap { color: var(--warn); }
.banner { margin: 12px 24px 0; border: 1px dashed var(--warn); background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 12.5px; }
.focus { position: sticky; top: 60px; z-index: 12; margin: 12px 24px 0; padding: 10px 12px; background: var(--panel); border: 1px solid var(--note); border-radius: 9px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.focus .d-top { font-size: 13.5px; flex-wrap: wrap; align-items: center; }
.focus ul { margin: 0; padding-left: 18px; color: var(--mid); font-size: 12.5px; }
.chapter { padding: 16px 24px 0; display: flex; flex-direction: column; gap: 12px; }
.chapter-head { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 10px; align-items: baseline; }
.chapter-head .n { font: 12px var(--mono); color: var(--dim); }
.chapter-head h2 { margin: 0; font-size: 14px; font-weight: 600; }
.chapter-head p { margin: 2px 0 0; grid-column: 2; font-size: 12.5px; color: var(--mid); }

.sym { border: 1px solid var(--line); border-radius: 9px; background: var(--panel); scroll-margin-top: 70px; }
.sym.current { box-shadow: 0 0 0 2px var(--note); }
.sym.dim { opacity: .35; }
.sym.dim:hover { opacity: .75; }
.sym-head { position: sticky; top: 52px; z-index: 5; display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 5px 8px 5px 6px; background: var(--panel); border-bottom: 1px solid var(--line2); border-radius: 9px 9px 0 0; box-shadow: 0 -10px 0 1px var(--bg); }
.sym.folded .sym-head { border-bottom-color: transparent; border-radius: 9px; }
.chev { width: 24px; height: 24px; border: 0; background: none; border-radius: 5px; color: var(--dim); cursor: pointer; display: flex; align-items: center; justify-content: center; flex: none; }
.chev:hover { background: var(--sunk); color: var(--ink); }
.chev svg { transition: transform .15s; }
.sym.folded .chev svg { transform: rotate(-90deg); }
.sig { font: 500 12.5px var(--mono); flex: 0 1 auto; min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; text-wrap: pretty; }
.path { font: 11.5px var(--mono); color: var(--dim); white-space: nowrap; flex: none; }
.tag { font-size: 11px; color: var(--move); white-space: nowrap; }
.tag.warn { color: var(--warn); }
.view input { margin: 0; accent-color: var(--add); }
.view .on { display: none; }
.view:has(input:checked) { color: var(--add); border-color: color-mix(in srgb, var(--add) 45%, transparent); background: var(--add-bg); }
.view:has(input:checked) .on { display: inline; }
.view:has(input:checked) .off { display: none; }
.sym.folded .body { display: none; }

.pill { flex: none; font-size: 11px; font-weight: 600; border: 1px solid transparent; border-radius: 5px; padding: 1px 7px; white-space: nowrap; }
.pill.care { color: var(--care); background: var(--care-bg); }
.pill.mech { color: var(--dim); background: var(--sunk); border: 1px solid var(--line); }
.pill.gap { color: var(--warn); background: var(--warn-bg); }
.unnarrated { color: var(--dim); font-style: italic; }
.id { font: 11px var(--mono); color: var(--dim); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border: 1px solid transparent; border-radius: 6px; background: var(--sunk); font-size: 12px; color: var(--mid); cursor: pointer; max-width: 100%; }
.chip:hover { border-color: var(--line); color: var(--ink); }
.chip.active { border-color: var(--note); color: var(--note); }
.chip .ct { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* the symbol's body: its code, and beside it why the code is the way it is */
.sym { container-type: inline-size; }
.body { display: grid; grid-template-columns: minmax(0, 1fr) 340px; }
.code-col { min-width: 0; border-right: 1px solid var(--line); }
/* Short code beside a longer explanation stays in view while you read it. */
.code-col.stick { position: sticky; top: 92px; align-self: start; border-right: 0; box-shadow: 1px 0 0 var(--line); }
.reasons { min-width: 0; display: flex; flex-direction: column; background: var(--panel); border-radius: 0 0 9px 0; font-size: 13px; line-height: 1.5; color: var(--ink); }
.reasons section { padding: 11px 16px 12px; border-top: 1px solid var(--line2); }
.reasons section:first-child { border-top: 0; }
.reasons h4 { margin: 0 0 5px; font-size: 12px; font-weight: 650; color: var(--ink); }
.reasons .risk h4 { color: var(--care); }
.reasons .attn.careful h4, .reasons .attn.careful p { color: var(--care); }
.reasons .attn.mechanical p { color: var(--mid); }
.reasons .gap h4, .reasons .gap p { color: var(--warn); }
.reasons p { margin: 4px 0 0; overflow-wrap: break-word; }
.reasons section > p:first-of-type { margin-top: 0; }
.reasons ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.reasons li { position: relative; padding-left: 16px; overflow-wrap: anywhere; }
.reasons li::before { position: absolute; left: 0; top: 0; font: 700 12px/19.5px var(--mono); }
.reasons .rej li::before { content: "✕"; color: var(--dim); font-size: 10px; }
.reasons .rej li b { font-weight: 600; margin-right: 6px; }
.reasons .rej li span { color: var(--mid); }
.reasons .risks li::before { content: "!"; color: var(--care); }
.reasons > .cmts { padding: 0 16px 14px; }
.badge { flex: none; font-size: 10.5px; font-weight: 650; border-radius: 4px; padding: 1px 6px; }
.badge.human { color: var(--human); background: var(--human-bg); }
.badge.agent { color: var(--agent); background: var(--agent-bg); }
.dref { display: flex; gap: 8px; align-items: baseline; width: 100%; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; color: var(--ink); font-size: 13px; font-weight: 600; line-height: 1.4; }
.dref .t { flex: 1; min-width: 0; }
.dref:hover .t { text-decoration: underline; }
.dref.active .t { color: var(--note); }
.also { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.also > p { margin: -3px 0 6px; } /* a decision's reasoning sits with its own title */
.also .sub { font-size: 11.5px; color: var(--mid); }
.also .dref { font-weight: 500; }
.reasons a.above { display: block; margin-top: 4px; font-size: 12px; color: var(--note); text-decoration: none; }
.reasons a.above:hover { text-decoration: underline; }
.t-row .nm { display: flex; gap: 6px; min-width: 0; }
.t-row .nm .t { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.t-row .nm .t.lead { direction: rtl; text-align: left; }
.t-row .nm .t.twin { white-space: normal; overflow-wrap: anywhere; } /* overloads differ at the end: show it all */ /* a long qualified name keeps its member: …Store::add */
.nw { white-space: nowrap; }
.reasons p, .imp .sum { text-wrap: pretty; }
.t-row .in { flex: none; color: var(--dim); font-size: 11.5px; }
.after { display: inline-block; font-size: 10.5px; line-height: 16px; color: var(--mid); border: 1px dashed var(--dim); border-radius: 4px; padding: 0 6px; white-space: nowrap; }
@container (max-width: 760px) {
  .body { grid-template-columns: minmax(0, 1fr); }
  .reasons { order: -1; border-radius: 0; border-bottom: 1px solid var(--line2); }
  .code-col { border-right: 0; }
}
.body .code { min-width: 0; --diffs-light-bg: var(--panel); --diffs-dark-bg: var(--panel); --diffs-font-family: var(--mono); --diffs-font-size: 12.5px; --diffs-line-height: 20px; --u-warn: var(--warn); border-radius: 0 0 0 9px; overflow: hidden; }
.collapsed-bar { display: block; width: 100%; border: 0; background: none; color: var(--mid); font-size: 12.5px; padding: 9px 14px; text-align: left; }
button.collapsed-bar { display: inline-flex; align-items: center; gap: 6px; width: auto; margin: 12px 14px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); font-weight: 500; cursor: pointer; }
button.collapsed-bar:hover { background: var(--sunk); }

.imports { display: grid; grid-template-columns: 14px fit-content(38%) minmax(0, 1fr) auto; column-gap: 12px; }
.imports > * { grid-column: 1 / -1; }
.imports .imp { display: grid; grid-template-columns: subgrid; row-gap: 12px; align-items: center; padding: 7px 10px 7px 14px; border-top: 1px solid var(--line2); scroll-margin-top: 70px; }
.imports .imp.current { box-shadow: inset 3px 0 0 var(--note); }
.imports .imp.dim { opacity: .35; }
.imports .imp.hidden, .sym.hidden { display: none; }
.imp-code { display: flex; flex-direction: column; min-width: 0; }
.imp code { font-size: 12.5px; overflow-wrap: anywhere; }
.imp .sum { font-size: 12.5px; color: var(--mid); }
.imp .acts { display: flex; gap: 6px; align-items: center; justify-self: end; }
.imp .imp-reasons { grid-column: 2 / -1; background: none; border-radius: 0; padding: 2px 0 4px; gap: 10px; }
.imp .imp-reasons ul { margin-top: 6px; }
.imp .chip .ct { display: none; }
.imp .cmts { grid-column: 2 / -1; }

/* ---------- comments ---------- */
.cmts:empty { display: none; }
.cmts { display: flex; flex-direction: column; gap: 8px; }
.cmts.in-code { margin: 6px 14px 8px; font-family: var(--sans); white-space: normal; line-height: 1.45; }
.cmt { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 9px 11px; font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
.cmt.editing { border-color: var(--note); }
.cmt textarea { display: block; width: 100%; min-height: 60px; resize: vertical; border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; background: var(--sunk); font-size: 13px; line-height: 1.45; }
.cmt textarea:focus { outline: none; border-color: var(--note); }
.c-top { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--dim); }
.c-top b { color: var(--ink); font-weight: 600; }
.c-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.c-foot { display: flex; gap: 8px; align-items: center; }
.c-foot .hint { margin-left: auto; display: flex; gap: 3px; }

/* ---------- review rail ---------- */
.rail-body { flex: 1; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.rail h3 { margin: 10px 0 0; font-size: 12px; font-weight: 650; color: var(--ink); }
.next { display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--sunk); }
.next .k { font-size: 11.5px; font-weight: 600; color: var(--mid); }
.next b { font-size: 14px; font-weight: 600; }
.next b.mono { font: 600 14px var(--mono); }
.next .why { font-size: 12.5px; color: var(--mid); }
.next .why.care { color: var(--care); }
.next .btn { margin-top: 4px; height: 32px; justify-content: center; }
.next .btn kbd { background: transparent; color: inherit; border-color: color-mix(in srgb, currentColor 35%, transparent); }
.next.done { border-color: color-mix(in srgb, var(--add) 45%, transparent); background: var(--add-bg); }
.next.done .k { color: var(--add); }
.r-item { display: flex; flex-direction: column; gap: 3px; text-decoration: none; cursor: pointer; }
.r-where { font: 11.5px var(--mono); color: var(--note); overflow-wrap: anywhere; }
.r-text { font-size: 12.5px; color: var(--ink); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.r-item:hover .r-text { color: var(--ink); }
.r-stale { font-size: 11.5px; color: var(--warn); }
.r-quote { margin: 0; font: 11.5px var(--mono); color: var(--dim); white-space: pre; overflow: hidden; text-overflow: ellipsis; border-left: 2px solid var(--line); padding-left: 8px; }
.r-care { display: flex; flex-direction: column; gap: 2px; }
.r-care a { display: flex; flex-direction: column; padding: 5px 8px; margin: 0 -8px; border-radius: 6px; text-decoration: none; }
.r-care a:hover { background: var(--sunk); }
.r-care .mono { font-size: 12.5px; color: var(--ink); }
.r-care span:last-child { font-size: 12px; color: var(--care); }
.rail-foot { padding: 14px 16px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.rail-foot .btn.primary { height: 34px; justify-content: center; }
.rail-foot .row { display: flex; justify-content: space-between; gap: 10px; font-size: 11.5px; color: var(--dim); }
.rail-foot .row .link { white-space: nowrap; font-size: 11.5px; }
.dref { border-radius: 5px; margin: -2px -4px; padding: 2px 4px; width: calc(100% + 8px); }
.dref { flex-wrap: wrap; }
.dref:hover { background: var(--note-bg); }
.dref .hint { display: none; flex-basis: 100%; padding-left: 2px; font-size: 11.5px; font-weight: 500; color: var(--note); }
.dref:hover .hint, .dref:focus-visible .hint, .dref.active .hint { display: block; }
.dref .h-on, .dref.active .h-show { display: none; }
.dref.active .h-on { display: inline; }
.chip:hover, .d-row:hover { border-color: var(--note); }
.dref:focus-visible, .chip:focus-visible { outline: 2px solid var(--note); outline-offset: 1px; }
#toast { position: fixed; bottom: 20px; left: 50%; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: 8px; font-size: 13px; transition: opacity .2s, transform .2s; z-index: 50; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
.rail-toggle { display: none; }
.zen-btn .z-off, body.zen .zen-btn .z-on { display: none; }
body.zen .zen-btn .z-off { display: block; }
body.zen .zen-btn { background: var(--ink); border-color: var(--ink); color: var(--panel); }
/* zen: no sidebars, just the code and why it's that way */
body.zen .layout { grid-template-columns: minmax(0, 1fr); }
body.zen .side, body.zen .rail, body.zen .rail-toggle { display: none !important; }
body.zen main { width: 100%; max-width: 1480px; margin: 0 auto; }
body.zen .body { grid-template-columns: minmax(0, 1fr) 420px; }

@media (max-width: 1240px) {
  .layout { grid-template-columns: 252px minmax(0, 1fr); }

  body.rail-open .rail { display: flex; }
  .rail-toggle { display: inline-flex; }
  .totals .meta-txt { display: none; }
}
@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; max-height: 45vh; border-right: 0; border-bottom: 1px solid var(--line); }

  .banner, .focus { margin-left: 14px; margin-right: 14px; }

  .path, .sym-head .num { display: none; }

}

    background-color: var(--diffs-decoration-bar-color, transparent);
    box-sizing: content-box;
    border-left: 2px solid var(--diffs-bg);
    border-right: 2px solid var(--diffs-bg);
    width: 6px;
    position: absolute;
    top: 0;
    bottom: 0;
    right: -2px;

    [data-decoration-bar-depth="1"] & {
      background-color: color-mix(in lab,
        var(--diffs-bg) 20%,
        var(--diffs-decoration-bar-color, transparent));
    }

    [data-decoration-bar-depth="2"] & {
      background-color: color-mix(in lab,
        var(--diffs-bg) 45%,
        var(--diffs-decoration-bar-color, transparent));
    }

    [data-decoration-bar-depth="3"] & {
      background-color: color-mix(in lab,
        var(--diffs-bg) 65%,
        var(--diffs-decoration-bar-color, transparent));
    }

    [data-decoration-bar-start] & {
      border-top-left-radius: 5px;
      border-top-right-radius: 5px;
    }

    [data-decoration-bar-end] & {
      z-index: 3;
      border-bottom-right-radius: 5px;
      border-bottom-left-radius: 5px;
    }
  }

  [data-placeholder] {
    contain: strict;
  }

  [data-error-wrapper] {
    padding: var(--diffs-gap-block, var(--diffs-gap-fallback))
      var(--diffs-gap-inline, var(--diffs-gap-fallback));
    scrollbar-width: none;
    max-height: 400px;
    overflow: auto;

    & [data-error-message] {
      color: var(--diffs-deletion-base);
      font-size: 18px;
      font-weight: bold;
    }

    & [data-error-stack] {
      color: var(--diffs-fg-number);
    }
  }
