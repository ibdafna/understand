<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Understand · feat/retry-backoff</title>
<style>
:root {

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111214; --panel: #18191c; --panel-2: #1d1e22; --ink: #e6e7ea; --muted: #a0a4ab; --faint: #6f737a;
    --line: #2a2c31; --line-2: #222428;

    --del-bg: #2d1618; --del-gutter: #3d1c1f; --del-ink: #ff8a80;
    --move-ink: #b69cf5; --move-bg: #251d38;
    --careful: #ff9a62; --careful-bg: #3a2216; --skim: #e5c14a; --skim-bg: #332b12; --mech: #9ba0a8; --mech-bg: #26282c;
    --human: #7eaaff; --human-bg: #1a2640; --agent: #c19bff; --agent-bg: #2a1f40;

}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); }
button { font: inherit; color: inherit; }
a { color: inherit; }
code, .mono { font-family: var(--mono); }

/* ---------- top bar ---------- */
.top { position: sticky; top: 0; z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; gap: 16px; padding: 10px 20px; flex-wrap: wrap; }
.brand { font-weight: 650; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.brand .logo { width: 18px; height: 18px; border-radius: 5px; background: linear-gradient(135deg, var(--human), var(--agent)); }
.branch { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.branch b { color: var(--ink); font-weight: 600; }
.stats { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.stats b { color: var(--ink); font-weight: 600; }
.spacer { flex: 1; }
.progress { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.progress .bar { width: 120px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.progress .bar i { display: block; height: 100%; background: var(--add-ink); transition: width .2s; }
.controls { display: flex; gap: 10px; padding: 8px 20px; border-top: 1px solid var(--line-2); align-items: center; flex-wrap: wrap; font-size: 12.5px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 4px 10px; cursor: pointer; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.ctl-label { color: var(--faint); }
.filter { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 10px 3px 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.filter[aria-pressed="false"] { opacity: .45; text-decoration: line-through; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.careful { background: var(--careful); } .dot.skim { background: var(--skim); } .dot.mechanical { background: var(--mech); } .dot.unexplained { background: var(--warn); outline: 2px dashed var(--warn); outline-offset: 1px; width: 6px; height: 6px; }
.kbd-hint { color: var(--faint); }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--panel-2); color: var(--muted); }

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); }
.side { position: sticky; top: var(--top-h, 92px); height: calc(100vh - var(--top-h, 92px)); overflow: auto; border-right: 1px solid var(--line); background: var(--panel-2); }
.tabs { display: flex; gap: 2px; padding: 10px 12px 0; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel-2); z-index: 2; }
.tabs button { border: 0; background: transparent; padding: 6px 10px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 550; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.tabs .count { font-size: 11px; color: var(--faint); margin-left: 3px; }
.o-group { padding: 10px 8px 4px; }
.o-title { font-size: 12px; font-weight: 650; padding: 4px 8px; display: flex; gap: 6px; align-items: baseline; }
.o-title .n { color: var(--faint); font-weight: 500; }
.o-item { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 6px; align-items: center; padding: 3px 8px; border-radius: 6px; text-decoration: none; font-size: 12.5px; color: var(--muted); }
.o-item:hover { background: var(--line-2); color: var(--ink); }
.o-item.current { background: var(--line); color: var(--ink); }
.o-item .nm { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.o-item.reviewed .nm { color: var(--faint); text-decoration: line-through; text-decoration-color: var(--faint); }
.o-item.dim { opacity: .3; }
.glyph { font-family: var(--mono); font-size: 12px; font-weight: 700; text-align: center; }
.glyph.added { color: var(--add-ink); } .glyph.removed { color: var(--del-ink); } .glyph.modified { color: var(--skim); } .glyph.moved { color: var(--move-ink); }

.d-card { margin: 10px 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); cursor: pointer; }
.d-card:hover { border-color: var(--faint); }
.d-card.active { border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); }
.d-card.superseded { opacity: .6; }
.d-head { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
.d-title { font-weight: 600; margin: 4px 0; font-size: 13px; line-height: 1.35; }
.d-ctx { font-size: 12.5px; color: var(--muted); margin: 0; }
.d-alts { margin: 6px 0 0; padding: 0; list-style: none; font-size: 12px; color: var(--muted); }
.d-alts li { padding-left: 14px; position: relative; margin-top: 2px; }
.d-alts li::before { content: "✕"; position: absolute; left: 0; color: var(--faint); font-size: 10px; top: 2px; }
.d-foot { margin-top: 6px; font-size: 11.5px; color: var(--faint); display: flex; gap: 8px; flex-wrap: wrap; }
.tag { font-size: 10.5px; padding: 1px 6px; border-radius: 4px; font-weight: 600; letter-spacing: .01em; }
.tag.super { background: var(--mech-bg); color: var(--mech); text-decoration: line-through; }
.tag.rev { background: var(--move-bg); color: var(--move-ink); }

/* ---------- main ---------- */
main { padding: 20px 24px 120px; min-width: 0; }
.intent { max-width: 980px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 18px; }

.intent p { margin: 0; color: var(--muted); max-width: 78ch; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.focus-banner { position: sticky; top: calc(var(--top-h, 92px) + 8px); z-index: 10; display: none; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--focus); box-shadow: var(--shadow); border-radius: 10px; padding: 8px 12px; margin-bottom: 14px; font-size: 13px; }
.focus-banner.on { display: flex; }
.focus-banner button { margin-left: auto; border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; padding: 2px 8px; cursor: pointer; }

.group { margin: 28px 0 10px; }
.group-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.group-head .num { font-family: var(--mono); color: var(--faint); font-size: 12px; }
.group-head h2 { font-size: 16px; margin: 0; letter-spacing: -.01em; }
.group-sum { color: var(--muted); margin: 0 0 12px; max-width: 80ch; font-size: 13.5px; }
.group-files { font-family: var(--mono); font-size: 11.5px; color: var(--faint); margin-bottom: 10px; }

.sym { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; scroll-margin-top: calc(var(--top-h, 92px) + 60px); transition: opacity .15s, box-shadow .15s; }
.sym:hover { border-color: color-mix(in srgb, var(--line) 50%, var(--faint)); }
.sym.kbd-current { box-shadow: 0 0 0 2px var(--focus); }
.sym.dim { opacity: .28; }
.sym.dim:hover { opacity: .7; }
.sym.hidden { display: none; }
.imports { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; }
.imports-head { display: flex; align-items: center; gap: 8px; padding: 7px 12px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line-2); }
.imports-head .loc { margin-left: auto; }
.imports .sym { border: 0; border-radius: 0; margin: 0; grid-template-columns: minmax(220px, 40%) minmax(0, 1fr); }
.imports .sym + .sym { border-top: 1px solid var(--line-2); }
.imports .sym:last-child .note { border-radius: 0 0 10px 0; }
.imports .sym.hidden-all { display: none; }
.is-import .chip .ct { display: none; }
.is-import .rev { font-size: 0; gap: 0; }
.code-col { min-width: 0; border-right: 1px solid var(--line-2); }
.sym-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
.status { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 1px 6px; border-radius: 4px; }
.status.added { background: var(--add-bg); color: var(--add-ink); }
.status.removed { background: var(--del-bg); color: var(--del-ink); }
.status.modified { background: var(--skim-bg); color: var(--skim); }
.status.moved { background: var(--move-bg); color: var(--move-ink); }
.kind { font-size: 11.5px; color: var(--faint); }
.sig { font-size: 12.5px; font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.loc { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--faint); }
.moved-path { font-family: var(--mono); font-size: 11.5px; color: var(--move-ink); }

.code { overflow-x: auto; font: 12.5px/1.6 var(--mono); padding: 4px 0; }
.ln { display: grid; grid-template-columns: 40px 40px 18px max-content; min-width: 100%; }
.ln > span { white-space: pre; }
.ln .no { color: var(--faint); text-align: right; padding-right: 8px; user-select: none; font-size: 11.5px; }
.ln .sg { user-select: none; text-align: center; color: var(--faint); }
.ln .tx { padding-right: 16px; tab-size: 4; }
.ln.add { background: var(--add-bg); } .ln.add .no { background: var(--add-gutter); } .ln.add .sg { color: var(--add-ink); }
.ln.del { background: var(--del-bg); } .ln.del .no { background: var(--del-gutter); } .ln.del .sg { color: var(--del-ink); }
.sym.st-removed .ln.del .tx { opacity: .75; }
.is-import .code { padding: 0; height: 100%; }
.is-import .ln { height: 100%; align-items: center; }
.collapsed-bar { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: var(--panel-2); color: var(--muted); font-size: 12px; padding: 7px 12px; cursor: pointer; text-align: left; border-radius: 0 0 0 10px; }
.collapsed-bar:hover { color: var(--ink); }
.collapsed-bar .why-collapsed { color: var(--faint); }

.tk-k { color: var(--tk-k); } .tk-s { color: var(--tk-s); } .tk-c { color: var(--tk-c); font-style: italic; } .tk-n { color: var(--tk-n); } .tk-t { color: var(--tk-t); } .tk-f { color: var(--tk-f); }

/* ---------- notes ---------- */
.note { padding: 10px 14px 12px; font-size: 13px; background: var(--panel); border-radius: 0 10px 10px 0; }
.is-import .note { padding: 4px 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border-radius: 0; }
.note-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.attn { font-size: 11px; font-weight: 650; display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px 1px 6px; border-radius: 999px; }
.attn.careful { background: var(--careful-bg); color: var(--careful); }
.attn.skim { background: var(--skim-bg); color: var(--skim); }
.attn.mechanical { background: var(--mech-bg); color: var(--mech); }
.rev { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--faint); cursor: pointer; user-select: none; }
.rev input { accent-color: var(--add-ink); margin: 0; }
.sum { margin: 0; line-height: 1.45; }
.is-import .sum { font-size: 12.5px; color: var(--muted); flex: 1; min-width: 160px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.is-import .chips { margin-top: 0; }
.chip { border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; padding: 1px 7px 1px 3px; font-size: 11.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; max-width: 100%; }
.chip:hover { border-color: var(--faint); }
.chip.active { border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); }
.chip .who { font-size: 9.5px; padding: 0 4px; }
.chip .ct { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.unexpl { margin-top: 8px; border: 1px dashed var(--warn); background: var(--warn-bg); color: var(--warn); border-radius: 7px; padding: 6px 9px; font-size: 12px; }
.unexpl b { display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; }
.more { border: 0; background: none; padding: 0; margin-top: 8px; color: var(--focus); font-size: 12px; cursor: pointer; font-weight: 550; }
.detail { margin-top: 8px; border-top: 1px solid var(--line-2); padding-top: 8px; display: none; }
.sym.open .detail { display: block; }
.detail h4 { margin: 8px 0 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); }
.detail h4:first-child { margin-top: 0; }
.detail p { margin: 0; color: var(--ink); font-size: 12.5px; }
.detail h4.risk { color: var(--careful); }
.detail .rel { display: flex; flex-wrap: wrap; gap: 2px 12px; }
.detail .rel a { font-family: var(--mono); font-size: 12px; color: var(--focus); text-decoration: none; overflow-wrap: anywhere; }
html { overflow-x: clip; }
.detail .rel a:hover { text-decoration: underline; }

/* ---------- hover-notes mode ---------- */
body.notes-hover .sym { grid-template-columns: minmax(0, 1fr); }
body.notes-hover .code-col { border-right: 0; }
body.notes-hover .note { display: none; position: absolute; right: 14px; top: 36px; width: min(380px, calc(100% - 28px)); z-index: 8; border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
body.notes-hover .is-import .note { top: calc(100% - 2px); }
body.notes-hover .sym:hover .note, body.notes-hover .sym:focus-within .note, body.notes-hover .sym.open .note { display: block; }
body.notes-hover .is-import:hover .note, body.notes-hover .is-import:focus-within .note { display: flex; }
body.notes-hover .sym:hover { z-index: 9; }
body.notes-hover .sym .hover-mark { display: inline-block; }
.hover-mark { display: none; margin-left: 6px; width: 7px; height: 7px; border-radius: 50%; }

@media (max-width: 1150px) {
  .sym, .imports .sym { grid-template-columns: minmax(0, 1fr); }
  .is-import .sum { min-width: 0; flex-basis: 100%; }
  .code-col { border-right: 0; border-bottom: 1px solid var(--line-2); }
  .note { border-radius: 0 0 10px 10px; }
  .collapsed-bar { border-radius: 0; }
}
@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  main { padding: 16px 16px 80px; }
  .kbd-hint { display: none; }
}
</style>

<body>

<header class="top" id="top">
  <div class="top-row">
    <div class="brand"><span class="logo"></span>Understand</div>
    <div class="branch"><b>feat/retry-backoff</b> ← main</div>
    <div class="stats" id="stats"></div>
    <div class="spacer"></div>
    <div class="progress"><span id="prog-text"></span><span class="bar"><i id="prog-bar"></i></span></div>
  </div>
  <div class="controls">
    <span class="ctl-label">Order</span>
    <div class="seg" id="seg-view">
      <button data-v="story" aria-pressed="true">Story</button>
      <button data-v="files" aria-pressed="false">Files</button>
    </div>
    <span class="ctl-label">Rationale</span>
    <div class="seg" id="seg-notes">
      <button data-v="side" aria-pressed="true">Beside code</button>
      <button data-v="hover" aria-pressed="false">On hover</button>
    </div>
    <span class="ctl-label">Show</span>
    <button class="filter" data-f="careful" aria-pressed="true"><span class="dot careful"></span>Review carefully</button>
    <button class="filter" data-f="skim" aria-pressed="true"><span class="dot skim"></span>Skim</button>
    <button class="filter" data-f="mechanical" aria-pressed="true"><span class="dot mechanical"></span>Mechanical</button>
    <div class="spacer"></div>
    <span class="kbd-hint"><kbd>j</kbd>/<kbd>k</kbd> move · <kbd>e</kbd> expand · <kbd>x</kbd> reviewed · <kbd>esc</kbd> clear</span>
  </div>
</header>

<div class="layout">
  <nav class="side" aria-label="Navigator">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="outline" aria-selected="true">Outline</button>
      <button role="tab" data-tab="decisions" aria-selected="false">Decisions<span class="count" id="dec-count"></span></button>
    </div>
    <div id="side-body"></div>
  </nav>

  <main id="main">
    <section class="intent">
      <h1>Make the edge API client survive upstream rate limiting</h1>
      <p id="intent"></p>
      <div class="legend">
        <span><span class="who human">you</span> decided in conversation</span>
        <span><span class="who agent">agent</span> decided on its own</span>
        <span><span class="dot unexplained"></span> changed with no recorded decision</span>
        <span><span class="glyph added">+</span>added <span class="glyph modified">~</span>modified <span class="glyph removed">−</span>removed <span class="glyph moved">→</span>moved</span>
      </div>
    </section>
    <div class="focus-banner" id="focus-banner"></div>
    <div id="groups"></div>
  </main>
</div>

<script>
/* =====================================================================
   Mock data. In the real tool this is generated:
   - symbols/lines/status  ← deterministic extractor (git + tree-sitter)
   - decisions             ← decision log recorded during the session
   - sum/why/how/risk      ← agent narration, grounded in the log
   ===================================================================== */
const DATA = {
  intent: "Retries now back off with jitter and respect Retry-After instead of hammering the upstream in lockstep. Non-idempotent requests are never retried. The legacy fixed-delay retry package is deleted, and the web UI shows a countdown instead of failing on the first 503.",
  sessions: 3, span: "Sep 21 – 23",
  files: {
    "internal/client/retry.go": "go",
    "internal/client/client.go": "go",
    "internal/client/legacy/backoff.go": "go",
    "internal/client/retry_test.go": "go",
    "web/src/api/fetcher.ts": "ts",
  },
  decisions: [
    { id: "D1", who: "human", session: 1, short: "Never retry non-idempotent requests",
      title: "Never retry non-idempotent requests (POST, PATCH)",
      ctx: "Asked whether retries should cover every request. You said POST /payments must never be retried: a duplicate charge is worse than a failed request.",
      alts: ["Retry everything using idempotency keys: upstream doesn't accept keys yet", "Per-route opt-out list: relies on people remembering to add each new POST route"] },

};
const state = {
  view: store.get("view", "story"),
  notes: store.get("notes", "side"),
  show: new Set(["careful", "skim", "mechanical"]),
  focus: null,
  reviewed: new Set(store.get("reviewed", [])),
  open: new Set(),
  codeOpen: new Set(),
  tab: "outline",
  current: null,
};

/* ---------- tiny syntax highlighter ---------- */
const KW = {
  go: new Set("package import func return if else for range switch case default type struct interface map chan go defer select var const break continue nil true false".split(" ")),
  ts: new Set("import from export function return if else for const let var new throw async await interface type null undefined true false of in class extends".split(" ")),
};
const TY = {
  go: new Set("int string bool error float64 any byte".split(" ")),
  ts: new Set("number string boolean void Promise Response RequestInit".split(" ")),
};
function hl(src, lang) {
  const re = /(\/\/.*$)|("(?:[^"\\]|\\.)*"|`[^`]*`|'(?:[^'\\]|\\.)*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_$][\w$]*)|(\s+|.)/g;
  let out = "", m;
  const span = (c, t) => `<span class="tk-${c}">${esc(t)}</span>`;
  while ((m = re.exec(src))) {
    const [tok, com, str, num, id] = m;
    if (com) out += span("c", com);
    else if (str) out += span("s", str);
    else if (num) out += span("n", num);
    else if (id) {
      if (KW[lang].has(id)) out += span("k", id);
      else if (TY[lang].has(id) || /^[A-Z]/.test(id)) out += span("t", id);
      else if (src[re.lastIndex] === "(" || src[re.lastIndex] === "<") out += span("f", id);
      else out += esc(id);
    } else out += esc(tok);
  }
  return out;
}

function lines(s) {
  let o = s.at?.[0], n = s.at?.[1];
  return s.code.split("\n").map((raw) => {
    let t, tx;
    if (s.status === "modified") { t = raw[0] === "+" || raw[0] === "-" ? raw[0] : " "; tx = raw.slice(1); }
    else { t = s.status === "added" ? "+" : s.status === "removed" ? "-" : " "; tx = raw; }
    const L = { t, tx, o: "", n: "" };
    if (t !== "+" && o != null) L.o = o++;
    if (t !== "-" && n != null) L.n = n++;
    return L;
  });
}

const GLYPH = { added: "+", removed: "−", modified: "~", moved: "→" };
const ATTN_LABEL = { careful: "Review carefully", skim: "Skim", mechanical: "Mechanical" };
const base = (p) => p.split("/").pop();
const lang = (s) => DATA.files[s.file];

function chipHTML(id) {
  const d = DEC[id];
  return `<button class="chip${state.focus === id ? " active" : ""}" data-dec="${id}" title="${esc(d.title)}">
    <span class="who ${d.who}">${d.who === "human" ? "you" : "agent"}</span><b>${id}</b><span class="ct">${esc(d.short)}</span></button>`;
}

function isCodeCollapsed(s) {
  if (s.kind === "import") return false;
  if (state.codeOpen.has(s.id)) return false;
  return s.status === "moved" || s.status === "removed" || s.attn === "mechanical";
}

function symHTML(s) {
  const L = lines(s);
  const imp = s.kind === "import";
  const collapsed = isCodeCollapsed(s);
  const lnHTML = L.map((l) => `<div class="ln ${l.t === "+" ? "add" : l.t === "-" ? "del" : ""}"><span class="no">${l.o}</span><span class="no">${l.n}</span><span class="sg">${l.t === " " ? "" : l.t}</span><span class="tx">${hl(l.tx, lang(s)) || " "}</span></div>`).join("");
  const firstLine = L.find((l) => l.n !== "")?.n ?? L[0].o;
  const head = imp ? "" : `<div class="sym-head">
      <span class="status ${s.status}">${s.status}</span>
      <span class="kind">${s.kind}</span>
      <code class="sig">${hl(s.sig, lang(s))}</code>
      ${s.moved ? `<span class="moved-path">from ${esc(s.moved)}</span>` : ""}
      <span class="loc">${base(s.file)}:${firstLine}</span>
      <span class="hover-mark dot ${s.unexplained ? "unexplained" : s.attn}"></span>
    </div>`;
  const collapseReason = s.status === "moved" ? "body unchanged" : s.status === "removed" ? "deleted" : "mechanical";
  const body = collapsed
    ? `<button class="collapsed-bar" data-code="${s.id}">▸ Show ${L.length} line${L.length > 1 ? "s" : ""} <span class="why-collapsed">· ${collapseReason}</span></button>`
    : `<div class="code">${lnHTML}</div>`;
  const hasDetail = s.why || s.how || s.risk || s.rel;
  const rev = `<label class="rev"><input type="checkbox" data-rev="${s.id}" ${state.reviewed.has(s.id) ? "checked" : ""}>Reviewed</label>`;
  const detail = hasDetail ? `<div class="detail">
      ${s.why ? `<h4>Why it exists</h4><p>${esc(s.why)}</p>` : ""}
      ${s.how ? `<h4>Why this way</h4><p>${esc(s.how)}</p>` : ""}
      ${s.risk ? `<h4 class="risk">Risks &amp; assumptions</h4><p>${esc(s.risk)}</p>` : ""}
      ${s.rel ? `<h4>Related</h4><p class="rel">${s.rel.map((r) => `<a href="#sym-${r}" data-jump="${r}">${esc(SYM[r].name)}</a>`).join("")}</p>` : ""}
    </div>` : "";
  const note = imp
    ? `<aside class="note"><span class="dot ${s.attn}" title="${ATTN_LABEL[s.attn]}"></span><span class="sum">${esc(s.sum)}</span><span class="chips">${s.dec.map(chipHTML).join("")}</span>${s.risk ? `<button class="more" data-open="${s.id}">risk ▸</button>` : ""}${rev}${detail}</aside>`
    : `<aside class="note">
        <div class="note-top">${s.unexplained ? `<span class="attn careful"><span class="dot unexplained"></span>Unexplained</span>` : `<span class="attn ${s.attn}"><span class="dot ${s.attn}"></span>${ATTN_LABEL[s.attn]}</span>`}${rev}</div>
        <p class="sum">${esc(s.sum)}</p>
        ${s.unexplained ? `<div class="unexpl"><b>No recorded decision</b>${esc(s.unexplainedNote)}</div>` : ""}
        ${s.dec.length ? `<div class="chips">${s.dec.map(chipHTML).join("")}</div>` : ""}
        ${hasDetail ? `<button class="more" data-open="${s.id}">${state.open.has(s.id) ? "Less ▾" : "Why, alternatives, risks ▸"}</button>` : ""}
        ${detail}
      </aside>`;
  const cls = ["sym", `st-${s.status}`, imp ? "is-import" : "", state.open.has(s.id) ? "open" : "", state.current === s.id ? "kbd-current" : ""].join(" ");
  return `<article class="${cls}" id="sym-${s.id}" data-id="${s.id}" tabindex="-1">
    <div class="code-col">${head}${body}</div>${note}</article>`;
}

function groups() {
  if (state.view === "story") {
    return DATA.chapters.map((c, i) => ({ key: c.id, num: String(i + 1).padStart(2, "0"), title: c.title, sum: c.sum, syms: c.syms.map((id) => SYM[id]) }));
  }
  return Object.keys(DATA.files).map((f) => {
    const syms = DATA.symbols.filter((s) => s.file === f).sort((a, b) => (a.at[1] ?? a.at[0]) - (b.at[1] ?? b.at[0]));
    const st = f.includes("legacy") ? "deleted" : syms.every((s) => s.status === "added") ? "new file" : "modified";
    return { key: f, num: "", title: f, sum: null, file: true, st, syms };
  });
}

/* consecutive imports from one file render as a single compact block */
function symsHTML(list) {
  let out = "";
  for (let i = 0; i < list.length; ) {
    const s = list[i];
    if (s.kind !== "import") { out += symHTML(s); i++; continue; }
    let j = i;
    while (j < list.length && list[j].kind === "import" && list[j].file === s.file) j++;
    const run = list.slice(i, j);
    const add = run.filter((x) => x.status === "added").length, del = run.length - add;
    out += `<div class="imports"><div class="imports-head"><b>imports</b>${add ? `<span class="glyph added">+${add}</span>` : ""}${del ? `<span class="glyph removed">−${del}</span>` : ""}<span class="loc">${base(s.file)}</span></div>${run.map(symHTML).join("")}</div>`;
    i = j;
  }
  return out;
}

function visible(s) {
  return state.show.has(s.attn) || s.unexplained;
}

function renderMain() {
  $("#groups").innerHTML = groups().map((g) => {
    const files = [...new Set(g.syms.map((s) => s.file))];
    return `<section class="group" id="g-${esc(g.key)}">
      <div class="group-head">${g.num ? `<span class="num">${g.num}</span>` : ""}<h2 class="${g.file ? "mono" : ""}">${esc(g.title)}</h2>${g.file ? `<span class="kind">${g.st}</span>` : ""}</div>
      ${g.sum ? `<p class="group-sum">${esc(g.sum)}</p><div class="group-files">${files.map(esc).join(" · ")}</div>` : ""}
      ${symsHTML(g.syms)}
    </section>`;
  }).join("");
  applyFilters();
}

function renderSide() {
  const body = $("#side-body");
  if (state.tab === "outline") {
    body.innerHTML = groups().map((g) => `<div class="o-group">
      <div class="o-title">${g.num ? `<span class="n">${g.num}</span>` : ""}<span>${esc(g.file ? base(g.title) : g.title)}</span></div>
      ${g.syms.map((s) => `<a class="o-item${state.reviewed.has(s.id) ? " reviewed" : ""}" href="#sym-${s.id}" data-jump="${s.id}" data-oid="${s.id}">
        <span class="glyph ${s.status}">${GLYPH[s.status]}</span><span class="nm">${esc(s.name)}</span><span class="dot ${s.unexplained ? "unexplained" : s.attn}"></span></a>`).join("")}
    </div>`).join("");
  } else {
    body.innerHTML = DATA.decisions.map((d) => {
      const n = DATA.symbols.filter((s) => s.dec.includes(d.id)).length;
      return `<div class="d-card${state.focus === d.id ? " active" : ""}${d.supersededBy ? " superseded" : ""}" data-dec="${d.id}">
        <div class="d-head"><b>${d.id}</b><span class="who ${d.who}">${d.who === "human" ? "you" : "agent"}</span><span>session ${d.session}</span>
          ${d.supersededBy ? `<span class="tag super">replaced by ${d.supersededBy}</span>` : ""}${d.supersedes ? `<span class="tag rev">revises ${d.supersedes}</span>` : ""}</div>
        <div class="d-title">${esc(d.title)}</div>
        <p class="d-ctx">${esc(d.ctx)}</p>
        ${d.alts.length ? `<ul class="d-alts">${d.alts.map((a) => `<li>${esc(a)}</li>`).join("")}</ul>` : ""}
        <div class="d-foot"><span>Shaped ${n} symbol${n === 1 ? "" : "s"}</span><span>context paraphrased</span></div>
      </div>`;
    }).join("");
  }
  applyFilters();
}

function applyFilters() {
  for (const el of $$(".sym")) {
    const s = SYM[el.dataset.id];
    el.classList.toggle("hidden", !visible(s));
    el.classList.toggle("dim", !!state.focus && !s.dec.includes(state.focus));
  }
  for (const el of $$(".imports")) el.style.display = $$(".sym:not(.hidden)", el).length ? "" : "none";
  for (const el of $$(".o-item")) {
    const s = SYM[el.dataset.oid];
    el.style.display = visible(s) ? "" : "none";
    el.classList.toggle("dim", !!state.focus && !s.dec.includes(state.focus));
  }
  const fb = $("#focus-banner");
  if (state.focus) {
    const d = DEC[state.focus];
    const n = DATA.symbols.filter((s) => s.dec.includes(d.id)).length;
    fb.innerHTML = `<span class="who ${d.who}">${d.who === "human" ? "you" : "agent"}</span><b>${d.id}</b><span>${esc(d.title)}</span><span style="color:var(--muted)">· ${n} symbols</span><button data-clear>Clear <kbd>esc</kbd></button>`;
    fb.classList.add("on");
  } else fb.classList.remove("on");
}

function renderStats() {
  const s = DATA.symbols;
  const human = DATA.decisions.filter((d) => d.who === "human").length;
  const unexpl = s.filter((x) => x.unexplained).length;
  const careful = s.filter((x) => x.attn === "careful").length;
  $("#stats").innerHTML = `<span><b>${DATA.sessions}</b> sessions · ${DATA.span}</span><span><b>${Object.keys(DATA.files).length}</b> files</span><span><b>${s.length}</b> symbols</span><span><b>${DATA.decisions.length}</b> decisions (${human} yours)</span><span><b style="color:var(--careful)">${careful}</b> to review carefully</span>${unexpl ? `<span><b style="color:var(--warn)">${unexpl}</b> unexplained</span>` : ""}`;
  $("#intent").textContent = DATA.intent;
  $("#dec-count").textContent = DATA.decisions.length;
}

function renderProgress() {
  const n = state.reviewed.size, t = DATA.symbols.length;
  $("#prog-text").textContent = `${n}/${t} reviewed`;
  $("#prog-bar").style.width = `${(100 * n) / t}%`;
}

function setFocus(id) {
  state.focus = state.focus === id ? null : id;
  renderMain(); renderSide();
  if (state.focus) {
    const first = DATA.symbols.find((s) => s.dec.includes(state.focus) && visible(s));
    const firstInOrder = $$(".sym:not(.dim):not(.hidden)")[0];
    (firstInOrder || (first && $("#sym-" + first.id)))?.scrollIntoView({ behavior: "smooth", block: "start" });
  }
}

function setCurrent(id, scroll = true) {
  state.current = id;
  $$(".sym.kbd-current").forEach((e) => e.classList.remove("kbd-current"));
  const el = $("#sym-" + id);
  if (!el) return;
  el.classList.add("kbd-current");
  if (scroll) el.scrollIntoView({ behavior: "smooth", block: "center" });
}

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-dec],[data-open],[data-code],[data-jump],[data-clear],[data-tab],#seg-view button,#seg-notes button,.filter");
  if (!t) return;
  if (t.matches("#seg-view button")) {
    state.view = t.dataset.v; store.set("view", state.view);
    $$("#seg-view button").forEach((b) => b.setAttribute("aria-pressed", b === t));
    renderMain(); renderSide();
  } else if (t.matches("#seg-notes button")) {
    state.notes = t.dataset.v; store.set("notes", state.notes);
    $$("#seg-notes button").forEach((b) => b.setAttribute("aria-pressed", b === t));
    document.body.classList.toggle("notes-hover", state.notes === "hover");
  } else if (t.matches(".filter")) {
    const f = t.dataset.f;
    state.show.has(f) ? state.show.delete(f) : state.show.add(f);
    t.setAttribute("aria-pressed", state.show.has(f));
    applyFilters();
  } else if (t.dataset.tab) {
    state.tab = t.dataset.tab;
    $$(".tabs button").forEach((b) => b.setAttribute("aria-selected", b === t));
    renderSide();
  } else if (t.dataset.dec) {
    setFocus(t.dataset.dec);
  } else if (t.dataset.open) {
    const id = t.dataset.open;
    state.open.has(id) ? state.open.delete(id) : state.open.add(id);
    const el = $("#sym-" + id);
    el.outerHTML = symHTML(SYM[id]);
    applyFilters();
  } else if (t.dataset.code) {
    state.codeOpen.add(t.dataset.code);
    $("#sym-" + t.dataset.code).outerHTML = symHTML(SYM[t.dataset.code]);
    applyFilters();
  } else if (t.dataset.jump) {
    e.preventDefault();
    const s = SYM[t.dataset.jump];
    if (!visible(s)) { state.show.add(s.attn); $$(".filter").forEach((b) => b.setAttribute("aria-pressed", state.show.has(b.dataset.f))); applyFilters(); }
    setCurrent(t.dataset.jump);
  } else if (t.dataset.clear !== undefined) {
    setFocus(state.focus);
  }
});

document.addEventListener("change", (e) => {
  const id = e.target.dataset?.rev;
  if (!id) return;
  e.target.checked ? state.reviewed.add(id) : state.reviewed.delete(id);
  store.set("reviewed", [...state.reviewed]);
  renderProgress();
  $$(`.o-item[data-oid="${id}"]`).forEach((el) => el.classList.toggle("reviewed", e.target.checked));
});

document.addEventListener("keydown", (e) => {
  if (e.target.matches("input, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const vis = $$(".sym:not(.hidden)").map((el) => el.dataset.id);
  const i = vis.indexOf(state.current);
  if (e.key === "j") setCurrent(vis[Math.min(vis.length - 1, i + 1)]);
  else if (e.key === "k") setCurrent(vis[Math.max(0, i - 1)]);
  else if (e.key === "e" && state.current) $(`#sym-${state.current} [data-open]`)?.click();
  else if (e.key === "x" && state.current) $(`#sym-${state.current} [data-rev]`)?.click();
  else if (e.key === "Escape") { if (state.focus) setFocus(state.focus); }
  else return;
  e.preventDefault();
});

/* scrollspy: highlight the symbol under the reading line in the outline */
let spyTimer;
window.addEventListener("scroll", () => {
  clearTimeout(spyTimer);
  spyTimer = setTimeout(() => {
    const y = (parseInt(getComputedStyle(document.documentElement).getPropertyValue("--top-h")) || 92) + 80;
    let cur = null;
    for (const el of $$(".sym:not(.hidden)")) { if (el.getBoundingClientRect().top <= y) cur = el.dataset.id; else break; }
    $$(".o-item.current").forEach((el) => el.classList.remove("current"));
    const o = cur && $(`.o-item[data-oid="${cur}"]`);
    if (o) { o.classList.add("current"); o.scrollIntoView({ block: "nearest" }); }
  }, 60);
}, { passive: true });

function syncTopHeight() {
  document.documentElement.style.setProperty("--top-h", $("#top").offsetHeight + "px");
}
new ResizeObserver(syncTopHeight).observe($("#top"));

/* ---------- init ---------- */
$$("#seg-view button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === state.view));
$$("#seg-notes button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === state.notes));
document.body.classList.toggle("notes-hover", state.notes === "hover");
renderStats(); renderProgress(); renderMain(); renderSide(); syncTopHeight();
</script>
</body>
</html>
